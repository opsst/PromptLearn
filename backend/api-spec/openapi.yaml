openapi: 3.0.3
info:
  title: PromptLearn Backend API
  version: 1.0.0
  description: |
    Local demo API for building, scheduling, and publishing one English mathematics syllabus per semester.
    Curriculum references come from the supplied OBEC mathematics PDF. Select one or more curriculum row IDs,
    generate a draft, then preview or save the teacher's edited plan. The published endpoint returns the latest
    published snapshot. This demo is designed for a trusted local environment. Response examples abbreviate
    document_html for readability.
    Video Replay provides a separate local demo for uploading a recording with a prepared transcript,
    publishing it, and playing the published MP4 through the Go backend.
servers:
  - url: http://127.0.0.1:8080
    description: Local Go service
tags:
  - name: Service
  - name: Curriculum
  - name: Syllabus
  - name: Timetable
  - name: Student View
  - name: Video Replay
paths:
  /healthz:
    get:
      tags: [Service]
      operationId: getHealth
      summary: Check that the HTTP service is running
      responses:
        '200':
          description: Service is reachable
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [ok]}
              examples:
                healthy:
                  $ref: '#/components/examples/Health'

  /v1/curriculum/math:
    get:
      tags: [Curriculum]
      operationId: getMathCurriculum
      summary: List the OBEC mathematics curriculum by grade and course type
      description: |
        Returns the original Thai curriculum text. Select row IDs from groups[].rows[].id.
        A row can contain multiple indicators or outcomes that share one topic.
      parameters:
        - name: grade
          in: query
          required: true
          description: Matthayom grade. Core supports 1–6 and additional supports 4–6.
          schema:
            $ref: '#/components/schemas/Grade'
          example: 6
        - name: course_type
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/CourseType'
          example: core
      responses:
        '200':
          description: Curriculum groups and their source rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurriculumSelection'
              examples:
                grade6:
                  $ref: '#/components/examples/MathCurriculum'
        '400':
          description: Invalid grade or unsupported grade and course-type combination
          content:
            text/plain:
              schema: {type: string}
              examples:
                invalidGrade:
                  $ref: '#/components/examples/InvalidGrade'
                unsupportedCourse:
                  $ref: '#/components/examples/UnsupportedCourse'
        '500':
          description: Curriculum could not be loaded
          content:
            text/plain:
              schema: {type: string}
              example: "curriculum unavailable\n"

  /v1/syllabi/draft:
    post:
      tags: [Syllabus]
      operationId: generateSyllabusDraft
      summary: Generate a one-semester syllabus draft
      description: |
        Uses the server's OpenAI or local curriculum planner. Omit assessment_weights or send an empty
        list to plan units and periods before assigning scores. This operation does not save the draft.
        Maximum request body size is 64 KiB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyllabusInput'
            examples:
              beforeScoring:
                $ref: '#/components/examples/DraftInput'
      responses:
        '200':
          description: Generated syllabus with English references and student-facing HTML
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyllabusDraft'
              examples:
                localPlanner:
                  $ref: '#/components/examples/GeneratedDraft'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '502':
          description: Planner failed or returned a plan that violates the input constraints
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
              examples:
                rejectedPlan:
                  value:
                    code: invalid_plan
                    message: the generated plan did not match the curriculum, sessions or scoring requirements
                plannerFailure:
                  value:
                    code: generation_failed
                    message: syllabus generation failed
        '503':
          description: The generator is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
              example: {code: syllabus_unavailable, message: syllabus generation is not configured}
        '504':
          description: The model request timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
              example: {code: model_timeout, message: syllabus generation timed out}

  /v1/timetable/availability:
    post:
      tags: [Timetable]
      operationId: countTeachingPeriods
      summary: Count available teaching periods for each class
      description: The course-wide count is the lowest available-period count across its classes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilityInput'
            examples:
              mondayClass:
                $ref: '#/components/examples/AvailabilityInput'
      responses:
        '200':
          description: Course-wide and per-class period counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Availability'
              examples:
                twoPeriods:
                  $ref: '#/components/examples/Availability'
        '400':
          description: Malformed JSON or an invalid timetable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
              examples:
                invalidJson:
                  value: {code: invalid_json, message: expected one JSON object with known fields}
                invalidDateRange:
                  value:
                    code: invalid_input
                    message: 'invalid timetable: use a date range shorter than one year'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '500':
          $ref: '#/components/responses/CourseFailed'

  /v1/syllabi/preview:
    post:
      tags: [Syllabus]
      operationId: previewSyllabus
      summary: Validate an edited plan and preview the syllabus
      description: |
        When timetable is included, the server assigns periods to the classes' available slots.
        Use the same request body to save the preview. This operation does not call the model or save a draft.
      requestBody:
        $ref: '#/components/requestBodies/SyllabusEdit'
      responses:
        '200':
          description: Validated syllabus and optional schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyllabusPreview'
              examples:
                withSchedule:
                  $ref: '#/components/examples/SyllabusPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '500':
          $ref: '#/components/responses/CourseFailed'

  /v1/syllabi:
    post:
      tags: [Syllabus]
      operationId: createSyllabus
      summary: Save a new syllabus draft
      requestBody:
        $ref: '#/components/requestBodies/SyllabusEdit'
      responses:
        '201':
          description: Draft created
          headers:
            Location:
              description: Relative URL of the saved draft
              schema: {type: string}
              example: /v1/syllabi/11112222333344445555666677778888
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedSyllabus'
              examples:
                savedDraft:
                  $ref: '#/components/examples/SavedDraft'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '500':
          $ref: '#/components/responses/CourseFailed'

  /v1/syllabi/{id}:
    parameters:
      - $ref: '#/components/parameters/SyllabusId'
    get:
      tags: [Syllabus]
      operationId: getSyllabus
      summary: Read the latest saved teacher draft
      responses:
        '200':
          description: Current saved draft, including any edits since publication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedSyllabus'
              examples:
                savedDraft:
                  $ref: '#/components/examples/SavedDraft'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/CourseFailed'
    put:
      tags: [Syllabus]
      operationId: replaceSyllabus
      summary: Replace the saved draft
      description: |
        Send the complete edited plan. For a previously published syllabus, the status becomes
        unpublished_changes and the student view continues to serve the last published snapshot.
      requestBody:
        $ref: '#/components/requestBodies/SyllabusEdit'
      responses:
        '200':
          description: Updated draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedSyllabus'
              examples:
                editedAfterPublication:
                  $ref: '#/components/examples/UpdatedDraft'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '500':
          $ref: '#/components/responses/CourseFailed'

  /v1/syllabi/{id}/publish:
    parameters:
      - $ref: '#/components/parameters/SyllabusId'
    post:
      tags: [Syllabus]
      operationId: publishSyllabus
      summary: Publish the saved draft for students
      description: Publishes the current saved draft. Send an empty request body. Publication requires a complete schedule and 100 assessment points.
      responses:
        '200':
          description: Draft published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedSyllabus'
              examples:
                published:
                  $ref: '#/components/examples/PublishedDraft'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The draft is missing a complete schedule or scored assessments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
              examples:
                notReady:
                  $ref: '#/components/examples/NotReady'
        '500':
          $ref: '#/components/responses/CourseFailed'

  /v1/published-syllabi/{id}:
    parameters:
      - $ref: '#/components/parameters/SyllabusId'
    get:
      tags: [Student View]
      operationId: getPublishedSyllabus
      summary: Read the published student view
      responses:
        '200':
          description: Course details, assessment weights, and teaching schedule from the latest publication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentSyllabus'
              examples:
                studentView:
                  $ref: '#/components/examples/StudentSyllabus'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/CourseFailed'

  /api/demo/recordings:
    post:
      tags: [Video Replay]
      operationId: uploadReplayRecording
      summary: Upload a draft recording and its prepared transcript
      description: |
        Available on loopback when REPLAY_DEMO_DATABASE_URL is configured. Uploading a draft leaves the
        current publication visible. The video must be an MP4 with H.264 video and AAC audio if present.
        The transcript is a UTF-8 JSON array of ReplaySegment objects, ordered by strictly increasing
        startMs. Each cue must end within the clip duration.
      parameters:
        - $ref: '#/components/parameters/ReplayTeacherRole'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReplayUpload'
            encoding:
              video:
                contentType: video/mp4
              transcript:
                contentType: application/json
      responses:
        '201':
          description: Draft created. Use recordingId to publish the clip.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayRecordingRef'
              example:
                recordingId: '8f368301-2f08-4a28-a652-97e07eef40d0'
        '400':
          $ref: '#/components/responses/ReplayInvalidMedia'
        '403':
          $ref: '#/components/responses/ReplayForbidden'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '500':
          $ref: '#/components/responses/ReplayFailed'

  /api/demo/publication:
    put:
      tags: [Video Replay]
      operationId: publishReplayRecording
      summary: Publish a recording to the demo lesson
      description: |
        Publishes the recording together with its transcript. Repeating the request for the current
        recording keeps the same publication. Selecting a different recording replaces the previous
        publication. Maximum JSON request body size is 1 KiB.
      parameters:
        - $ref: '#/components/parameters/ReplayTeacherRole'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplayRecordingRef'
            example:
              recordingId: '8f368301-2f08-4a28-a652-97e07eef40d0'
      responses:
        '200':
          description: The selected recording is published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayRecordingRef'
              example:
                recordingId: '8f368301-2f08-4a28-a652-97e07eef40d0'
        '400':
          description: Malformed JSON, an unknown request field, or missing recordingId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayError'
              examples:
                invalidJson:
                  value: {code: invalid_json, message: expected one JSON object with known fields}
                missingRecording:
                  value: {code: invalid_media, message: เลือกคลิปที่จะเผยแพร่}
        '403':
          $ref: '#/components/responses/ReplayForbidden'
        '404':
          $ref: '#/components/responses/ReplayRecordingNotFound'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '500':
          $ref: '#/components/responses/ReplayFailed'

  /api/demo/replay:
    get:
      tags: [Video Replay]
      operationId: getPublishedReplay
      summary: Read the current published recording and transcript
      description: |
        Returns published false when no recording has been published. When published is true, use
        videoUrl to load the MP4 and startMs to seek to each transcript cue.
      responses:
        '200':
          description: Publication state for the demo lesson
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ReplayUnpublished'
                  - $ref: '#/components/schemas/ReplayPublished'
              examples:
                published:
                  value:
                    published: true
                    videoUrl: /api/demo/recordings/8f368301-2f08-4a28-a652-97e07eef40d0/video
                    recordingId: '8f368301-2f08-4a28-a652-97e07eef40d0'
                    durationMs: 69022
                    transcript:
                      - startMs: 0
                        endMs: 17476
                        text: วันนี้เราจะเรียนเรื่องการคูณเลขยกกำลังที่มีฐานเดียวกัน
                unpublished:
                  value:
                    published: false
        '403':
          $ref: '#/components/responses/ReplayForbidden'
        '500':
          $ref: '#/components/responses/ReplayFailed'

  /api/demo/recordings/{id}/video:
    parameters:
      - $ref: '#/components/parameters/ReplayRecordingId'
      - name: Range
        in: header
        description: Optional HTTP byte range for seeking or resuming playback.
        schema:
          type: string
        example: bytes=0-1023
    get:
      tags: [Video Replay]
      operationId: getPublishedReplayVideo
      summary: Download or seek within the published MP4
      description: The URL is available while its recording is the current publication for the demo lesson.
      responses:
        '200':
          description: Complete MP4
          headers:
            Accept-Ranges:
              description: Supported range unit
              schema: {type: string, enum: [bytes]}
          content:
            video/mp4:
              schema: {type: string, format: binary}
        '206':
          description: Requested byte range or ranges
          headers:
            Content-Range:
              description: Byte range and total file size for a single range
              schema: {type: string}
              example: bytes 0-1023/794872
          content:
            video/mp4:
              schema: {type: string, format: binary}
            multipart/byteranges:
              schema: {type: string, format: binary}
        '304':
          description: The file has not been modified since the requested validator
        '403':
          $ref: '#/components/responses/ReplayForbidden'
        '404':
          $ref: '#/components/responses/ReplayRecordingNotFound'
        '416':
          description: Invalid or unsatisfiable byte range
          content:
            text/plain:
              schema: {type: string}
        '500':
          $ref: '#/components/responses/ReplayFailed'
    head:
      tags: [Video Replay]
      operationId: headPublishedReplayVideo
      summary: Read published MP4 headers
      description: Returns the corresponding GET status and headers with an empty response body.
      responses:
        '200':
          description: Headers for the complete MP4
          headers:
            Content-Length:
              description: File size in bytes
              schema: {type: integer, format: int64}
            Accept-Ranges:
              description: Supported range unit
              schema: {type: string, enum: [bytes]}
        '206':
          description: Headers for the requested byte range or ranges
          headers:
            Content-Range:
              description: Byte range and total file size for a single range
              schema: {type: string}
        '304':
          description: The file has not been modified since the requested validator
        '403':
          description: The replay service accepts only loopback hosts
        '404':
          description: Recording is not the current publication or its video file is missing
        '416':
          description: Invalid or unsatisfiable byte range
        '500':
          description: The service could not read the video

components:
  parameters:
    SyllabusId:
      name: id
      in: path
      required: true
      description: ID from the saved syllabus response
      schema:
        $ref: '#/components/schemas/SyllabusId'
      example: '11112222333344445555666677778888'

    ReplayTeacherRole:
      name: X-Demo-Role
      in: header
      required: true
      description: Selects the teacher role for local demo writes.
      schema:
        type: string
        enum: [teacher]
      example: teacher
    ReplayRecordingId:
      name: id
      in: path
      required: true
      description: ID of the currently published recording.
      schema:
        type: string
        format: uuid
      example: '8f368301-2f08-4a28-a652-97e07eef40d0'

  requestBodies:
    SyllabusEdit:
      required: true
      description: Complete teacher-edited syllabus. Maximum request body size is 512 KiB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SyllabusEdit'
          examples:
            oneClass:
              $ref: '#/components/examples/SyllabusEdit'

  responses:
    BadRequest:
      description: Malformed JSON, an unknown request field, or failed domain validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
          examples:
            invalidJson:
              value: {code: invalid_json, message: expected one JSON object with known fields}
            invalidInput:
              $ref: '#/components/examples/InvalidDraftInput'
    NotFound:
      description: The requested draft or published snapshot does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
          examples:
            missingCourse:
              $ref: '#/components/examples/NotFound'
    RequestTooLarge:
      description: The request body exceeds the endpoint size limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
          example: {code: request_too_large, message: request body is too large}
    CourseFailed:
      description: The service could not complete the course operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
          example: {code: course_failed, message: course operation failed}

    ReplayInvalidMedia:
      description: Missing file part, invalid MP4, or invalid transcript
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReplayError'
          example: {code: invalid_media, message: เลือกไฟล์ MP4 และ transcript JSON}
    ReplayForbidden:
      description: Teacher role required for writes, or the request host is outside loopback
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReplayError'
          example: {code: forbidden, message: เปิดมุมมองครูเพื่อจัดการคลิป}
    ReplayRecordingNotFound:
      description: Recording unavailable for the requested operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReplayError'
          example: {code: recording_not_found, message: ไม่พบคลิป}
    ReplayFailed:
      description: The service could not complete the replay operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReplayError'
          example: {code: replay_error, message: จัดการคลิปไม่สำเร็จ ลองใหม่อีกครั้ง}

  schemas:
    ReplayError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [invalid_json, invalid_media, forbidden, recording_not_found, replay_error]
        message:
          type: string
    ReplayUpload:
      type: object
      required: [video, transcript]
      properties:
        video:
          type: string
          format: binary
          description: MP4 file part with a .mp4 filename. Maximum 50,000,000 bytes.
        transcript:
          type: string
          format: binary
          description: JSON file part containing a nonempty array of ReplaySegment objects. Maximum 256 KiB.
    ReplayRecordingRef:
      type: object
      additionalProperties: false
      required: [recordingId]
      properties:
        recordingId:
          type: string
          format: uuid
    ReplaySegment:
      type: object
      additionalProperties: false
      required: [startMs, endMs, text]
      properties:
        startMs:
          type: integer
          minimum: 0
          description: Start offset in milliseconds. Each start is later than the previous cue's start.
        endMs:
          type: integer
          minimum: 1
          description: End offset in milliseconds. It must be later than startMs and within the recording.
        text:
          type: string
          minLength: 1
          description: Cue text. Whitespace-only text is invalid.
    ReplayUnpublished:
      type: object
      required: [published]
      properties:
        published:
          type: boolean
          enum: [false]
    ReplayPublished:
      type: object
      required: [published, videoUrl, recordingId, durationMs, transcript]
      properties:
        published:
          type: boolean
          enum: [true]
        videoUrl:
          type: string
          description: Origin-relative URL of the current MP4.
        recordingId:
          type: string
          format: uuid
        durationMs:
          type: integer
          minimum: 1
        transcript:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ReplaySegment'
    Grade:
      type: integer
      minimum: 1
      maximum: 6
    CourseType:
      type: string
      enum: [core, additional]
    SyllabusId:
      type: string
      pattern: '^[0-9a-f]{32}$'
    Term:
      type: integer
      enum: [1, 2]
    APIError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [invalid_json, invalid_input, request_too_large, syllabus_unavailable, model_timeout, invalid_plan, generation_failed, not_found, not_ready, course_failed]
        message:
          type: string
    CurriculumSource:
      type: object
      required: [title, file, sha256]
      properties:
        title: {type: string}
        file: {type: string}
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
    LearningOutcome:
      type: object
      required: [number, text]
      properties:
        number: {type: integer, minimum: 1}
        text: {type: string}
        code: {type: string, description: Official indicator code for a core course.}
    CurriculumRow:
      type: object
      required: [id, grade, pdf_page, printed_page, title, outcomes, content]
      properties:
        id: {type: string, description: Curriculum row ID accepted in reference_ids.}
        grade:
          $ref: '#/components/schemas/Grade'
        pdf_page: {type: integer, minimum: 1, description: Page position in the PDF.}
        printed_page: {type: integer, minimum: 1, description: Number printed on the source page.}
        title: {type: string}
        outcomes:
          type: array
          items:
            $ref: '#/components/schemas/LearningOutcome'
        content:
          type: array
          items: {type: string}
    CurriculumStandard:
      type: object
      required: [strand, statement]
      properties:
        strand: {type: string}
        standard_code: {type: string, description: Standard code for a core course.}
        objective_number: {type: integer, minimum: 1, description: Objective number for an additional course.}
        statement: {type: string}
    CurriculumGroup:
      allOf:
        - $ref: '#/components/schemas/CurriculumStandard'
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: '#/components/schemas/CurriculumRow'
    CurriculumReference:
      allOf:
        - $ref: '#/components/schemas/CurriculumStandard'
        - type: object
          required: [row]
          properties:
            row:
              $ref: '#/components/schemas/CurriculumRow'
    CurriculumSelection:
      type: object
      required: [source, grade, course_type, groups]
      properties:
        source:
          $ref: '#/components/schemas/CurriculumSource'
        grade:
          $ref: '#/components/schemas/Grade'
        course_type:
          $ref: '#/components/schemas/CourseType'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/CurriculumGroup'
    AssessmentWeight:
      type: object
      required: [category, points]
      properties:
        category: {type: string, minLength: 1, description: Category name in English.}
        points: {type: integer, minimum: 1, maximum: 100}
    SyllabusInput:
      type: object
      required: [course_name, grade, course_type, term, total_sessions, minutes_per_session, reference_ids]
      properties:
        course_name: {type: string, minLength: 1, description: Course name in English.}
        course_code: {type: string, description: Optional school course identifier.}
        grade:
          $ref: '#/components/schemas/Grade'
        course_type:
          $ref: '#/components/schemas/CourseType'
        term:
          $ref: '#/components/schemas/Term'
        total_sessions: {type: integer, minimum: 1, maximum: 1000}
        minutes_per_session: {type: integer, minimum: 1, maximum: 1439}
        reference_ids:
          type: array
          minItems: 1
          uniqueItems: true
          description: Rows selected for this semester from the specified grade and course type.
          items: {type: string}
        assessment_weights:
          type: array
          nullable: true
          description: If nonempty, use unique category names and a combined total of 100 points.
          items:
            $ref: '#/components/schemas/AssessmentWeight'
    Assessment:
      type: object
      required: [title, category, session, points]
      properties:
        title: {type: string, minLength: 1, description: Assessment title in English.}
        category: {type: string, description: Exact category name from assessment_weights.}
        session:
          type: integer
          minimum: 1
          description: One-based unit period in a plan request. One-based course period in responses.
        points: {type: integer, minimum: 1, maximum: 100}
    PlannedUnit:
      type: object
      required: [title, reference_ids, session_titles]
      properties:
        title: {type: string, minLength: 1, description: Unit title in English.}
        reference_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string}
        session_titles:
          type: array
          minItems: 1
          items: {type: string, minLength: 1}
        assessments:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/Assessment'
    EditedPlan:
      type: object
      required: [description, units]
      description: |
        Assign each course reference to exactly one unit. The total number of session titles must match
        total_sessions. Each assessment category's total must match its requested weight.
      properties:
        description: {type: string, minLength: 1, description: Course description in English.}
        units:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PlannedUnit'
    NumberedSession:
      type: object
      required: [number, title]
      properties:
        number: {type: integer, minimum: 1}
        title: {type: string}
    SyllabusUnit:
      type: object
      required: [title, reference_ids, sessions, assessments]
      properties:
        title: {type: string}
        reference_ids:
          type: array
          items: {type: string}
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/NumberedSession'
        assessments:
          type: array
          items:
            $ref: '#/components/schemas/Assessment'
    SyllabusDraft:
      allOf:
        - $ref: '#/components/schemas/SyllabusInput'
        - type: object
          required: [course_code, assessment_weights, source, references, description, units, document_html]
          properties:
            planning_mode:
              type: string
              enum: [curriculum, openai, manual]
            source:
              $ref: '#/components/schemas/CurriculumSource'
            references:
              type: array
              description: English translations with the source IDs, codes and page numbers.
              items:
                $ref: '#/components/schemas/CurriculumReference'
            description: {type: string}
            units:
              type: array
              items:
                $ref: '#/components/schemas/SyllabusUnit'
            document_html:
              type: string
              description: Complete student-facing English syllabus document, with dates if present.
    ClockTime:
      type: string
      description: Time in Bangkok in HH:MM format.
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
    WeeklySlot:
      type: object
      required: [weekday, start_time]
      properties:
        weekday: {type: integer, minimum: 1, maximum: 7, description: 1 is Monday and 7 is Sunday.}
        start_time:
          $ref: '#/components/schemas/ClockTime'
    ClassTimetable:
      type: object
      required: [id, slots]
      properties:
        id: {type: string, minLength: 1}
        slots:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WeeklySlot'
    Timetable:
      type: object
      required: [start_date, end_date, classes]
      description: The date range is inclusive and shorter than one year. Weekly time slots must not overlap across classes.
      properties:
        start_date: {type: string, format: date}
        end_date: {type: string, format: date}
        excluded_dates:
          type: array
          nullable: true
          description: Dates skipped across all classes.
          items: {type: string, format: date}
        classes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ClassTimetable'
    AvailabilityInput:
      type: object
      required: [minutes_per_session, timetable]
      properties:
        minutes_per_session: {type: integer, minimum: 1, maximum: 1439}
        timetable:
          $ref: '#/components/schemas/Timetable'
    ClassAvailability:
      type: object
      required: [class_id, available_sessions]
      properties:
        class_id: {type: string}
        available_sessions: {type: integer, minimum: 0}
    Availability:
      type: object
      required: [available_sessions, classes]
      properties:
        available_sessions: {type: integer, minimum: 0}
        classes:
          type: array
          items:
            $ref: '#/components/schemas/ClassAvailability'
    ScheduleMeeting:
      type: object
      required: [session, unit, title, date, start_time, end_time, assessments]
      properties:
        session: {type: integer, minimum: 1}
        unit: {type: string}
        title: {type: string}
        date: {type: string, format: date}
        start_time:
          $ref: '#/components/schemas/ClockTime'
        end_time:
          $ref: '#/components/schemas/ClockTime'
        assessments:
          type: array
          items:
            $ref: '#/components/schemas/Assessment'
    ClassSchedule:
      allOf:
        - $ref: '#/components/schemas/ClassAvailability'
        - type: object
          required: [meetings]
          properties:
            meetings:
              type: array
              items:
                $ref: '#/components/schemas/ScheduleMeeting'
    TeachingSchedule:
      type: object
      required: [timezone, available_sessions, classes]
      properties:
        timezone: {type: string, enum: [Asia/Bangkok]}
        available_sessions: {type: integer, minimum: 0}
        classes:
          type: array
          items:
            $ref: '#/components/schemas/ClassSchedule'
    SyllabusEdit:
      type: object
      required: [course, plan]
      properties:
        course:
          $ref: '#/components/schemas/SyllabusInput'
        plan:
          $ref: '#/components/schemas/EditedPlan'
        timetable:
          $ref: '#/components/schemas/Timetable'
    SyllabusPreview:
      type: object
      required: [syllabus]
      description: Timetable and schedule are returned when the request included a timetable.
      properties:
        syllabus:
          $ref: '#/components/schemas/SyllabusDraft'
        timetable:
          $ref: '#/components/schemas/Timetable'
        schedule:
          $ref: '#/components/schemas/TeachingSchedule'
    SavedSyllabus:
      allOf:
        - $ref: '#/components/schemas/SyllabusPreview'
        - type: object
          required: [id, status]
          properties:
            id:
              $ref: '#/components/schemas/SyllabusId'
            status:
              type: string
              enum: [draft, published, unpublished_changes]
    StudentSyllabus:
      type: object
      required: [id, course_name, grade, term, assessment_weights, schedule]
      properties:
        id:
          $ref: '#/components/schemas/SyllabusId'
        course_name: {type: string}
        course_code: {type: string}
        grade:
          $ref: '#/components/schemas/Grade'
        term:
          $ref: '#/components/schemas/Term'
        assessment_weights:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentWeight'
        schedule:
          $ref: '#/components/schemas/TeachingSchedule'

